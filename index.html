<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --navy:#0b2c4f; --navy-2:#071d36; --brand:#e8a55f; --brand-dark:#c9823a; --blue:#1d6fe0; --blue-soft:#e6efff;
  --bg:#edf1f7; --surface:#ffffff; --ink:#15233d; --muted:#67748a; --line:#dce3ee;
  --green:#16a05d; --green-soft:#e3f6ec; --red:#dc3b34; --red-soft:#fde8e7;
  --amber:#e9951a; --amber-soft:#fff3df; --purple:#6b4fd8; --purple-soft:#efebff;
  --teal:#0e9c9a; --teal-soft:#e0f5f4; --gray:#8a94a6;
  --radius:12px; --shadow:0 1px 2px rgba(15,43,91,.06),0 4px 14px rgba(15,43,91,.05);
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8bb6ff;outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px calc(30px + env(safe-area-inset-bottom));
  background:var(--navy);position:relative;overflow:hidden}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#login::before{width:560px;height:560px;right:-180px;bottom:-200px;border:48px solid rgba(255,255,255,.035)}
#login::after{width:170px;height:170px;right:30px;bottom:30px;background:rgba(255,255,255,.035)}
.login-card{width:min(380px,100%);position:relative;z-index:1}




.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
.field .help{font-size:12px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink);caret-color:var(--navy);width:100%}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 40px #fff inset}
::placeholder{color:#9aa5b8}
textarea{min-height:84px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f4f6fa;color:#4a5568}
.err{background:var(--red-soft);color:#9b1c16;border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.amber{background:var(--amber)}
.btn.block{width:100%;padding:11px}
.btn.sm{padding:6px 12px;font-size:13px}

/* ---------- Shell ---------- */
#app{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--navy);color:#dfe7f7;display:flex;flex-direction:column;z-index:20}
.side .logo{display:flex;align-items:center;gap:8px;padding:18px 12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .logo b{display:block;color:#fff;font-size:15px}
.side .logo small{color:#9fb2d6;font-size:12px}
.nav{flex:1;overflow:auto;padding:10px 10px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:9px 12px;border-radius:9px;text-align:left;font-size:14px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:#fff;color:var(--navy);font-weight:600}
.nav .grp{font-size:12px;color:#8ea3cb;margin:12px 12px 4px}
.badge{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.side .me{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side .me b{color:#fff;display:block}
.side .me .row{display:flex;gap:6px;margin-top:8px}
.side .me button{flex:1;background:rgba(255,255,255,.08);border:0;color:#dfe7f7;border-radius:8px;padding:6px;font-size:12px}
.main{margin-left:232px;padding:18px 20px 40px}
.menu-btn{display:none}

.banner{background:linear-gradient(100deg,var(--navy) 0%,#123f6e 100%);border-bottom:3px solid var(--brand);color:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:16px}
.banner svg.pulse{position:absolute;right:0;bottom:-6px;opacity:.16;pointer-events:none}
.banner h2{margin:0;font-size:20px;line-height:1.35}
.banner p{margin:2px 0 0;color:#b8c8e8;font-size:13px}
.banner .filters{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;position:relative}
.banner select{background:#fff;color:var(--ink);border:0;width:auto;min-width:170px}

.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{margin:0;font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px}
.page-head .spacer{flex:1}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;border-top:3px solid var(--c,var(--blue));display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cs,var(--blue-soft));color:var(--c,var(--blue));flex:none}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
.kpi .val{font-size:24px;font-weight:700;color:var(--c,var(--ink))}
.kpi .foot{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:600}
.delta.good{color:var(--green)} .delta.bad{color:var(--red)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-3{grid-column:span 3}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.chart-box{position:relative;height:230px}
canvas{max-width:100%}
.empty{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center}

.donut-wrap{display:flex;align-items:center;gap:14px}
.donut-wrap .chart-box{width:140px;height:140px;flex:none}
.legend li span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.legend{list-style:none;margin:0;padding:0;flex:1;font-size:12.5px;min-width:0}
.legend li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.legend li:last-child{border:0}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend .n{margin-inline-start:auto;font-weight:600}
.legend .p{color:var(--muted);width:34px;text-align:right;flex:none}
.center-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center-label b{font-size:24px;display:block;line-height:1}
.center-label small{color:var(--muted);font-size:11px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f4f9;color:#3c4a63;font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f9fd}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-red{background:var(--red-soft);color:#b42318}.p-amber{background:var(--amber-soft);color:#a15c00}
.p-green{background:var(--green-soft);color:#0c7a43}.p-blue{background:var(--blue-soft);color:#174ea6}
.p-gray{background:#eef1f5;color:#4a5568}.p-purple{background:var(--purple-soft);color:#4b33b0}
.clip{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.alerts li:last-child{border:0}
.alerts .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;margin-top:1px}
.alerts .txt{flex:1;min-width:0}
.alerts .meta{color:var(--muted);font-size:12px}
.notes{margin:0;padding-inline-start:18px;font-size:13px}
.notes li{margin-bottom:6px}
.bar{height:6px;background:#eef1f5;border-radius:6px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--blue)}

h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px 8px;font-weight:600}
.computed.bad{background:var(--red-soft);border-color:#f3b5b0;color:#9b1c16}
.flag-why{font-size:11.5px;color:var(--muted);max-width:260px;margin-top:2px;line-height:1.35}
.heat{display:flex;align-items:center;gap:6px}
.hm-ylab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted)}
.hm-grid{flex:1;display:grid;grid-template-columns:18px repeat(5,1fr);gap:3px}
.hm-cell{aspect-ratio:1.5;border-radius:5px;display:grid;place-items:center;font-size:13px}
.hm-axis{font-size:11px;color:var(--muted);display:grid;place-items:center}
.hm-xlab{text-align:center;font-size:11px;color:var(--muted);margin-top:2px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-kpis div{background:#f4f7fc;border-radius:10px;padding:10px;text-align:center}
.mini-kpis b{display:block;font-size:22px}
.mini-kpis span{font-size:11.5px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
.chip b{background:var(--red-soft);color:#b42318;border-radius:10px;padding:0 7px;font-size:12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on b{background:var(--brand);color:var(--navy)}
.iss-title{font-weight:600}
.iss-reason{font-size:12.5px;color:#b42318;margin-top:2px}
.sec-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--navy);background:var(--blue-soft);border-radius:8px;padding:2px 8px}
.rcard .iss-title{margin:4px 0 2px}
.ro-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.ro-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;min-width:0}
.ro-row > span{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.ro-row.wide{grid-column:1/-1}
.kpi.click,.alerts li.click{cursor:pointer}
.kpi.click:hover{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.alerts li.click:hover .txt{text-decoration:underline}
@media (max-width:900px){.ro-grid{grid-template-columns:1fr}#iMod{display:none}.toolbar{flex-wrap:wrap}#iQ{flex-basis:100%}}

/* ---------- Lists & forms ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto;min-width:180px}
.modal-bg{position:fixed;inset:0;background:rgba(10,31,68,.45);z-index:50;display:flex;justify-content:flex-end}
.modal{background:var(--surface);width:min(760px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:17px;flex:1}
.modal .body{padding:18px 20px;overflow:auto;flex:1}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fafbfd}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.form-grid .wide{grid-column:1/-1}
.req{color:var(--red)}
.computed{background:#f4f7fc;border:1px dashed #c6d3ea;border-radius:9px;padding:9px 11px;font-weight:600;min-height:41px}
.callout{border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.callout.red{background:var(--red-soft);color:#8a1c16}
.callout.blue{background:var(--blue-soft);color:#174ea6}
.meta-line{color:var(--muted);font-size:12px;margin-bottom:12px}
.att{border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
.att h4{margin:0 0 8px;font-size:14px}
.att ul{list-style:none;margin:0 0 10px;padding:0}
.att li{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f6f8fc;border-radius:8px;margin-bottom:6px;font-size:13px}
.att li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;padding:2px 4px}
.linkbtn.danger{color:var(--red)}
.foot-spacer{flex:1}
.return-box{width:100%}

#toast{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;max-width:360px}
.toast.err{background:#9b1c16}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:40px;justify-content:center}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1440px){.span-3,.span-4{grid-column:span 6}.rec-panel{grid-column:span 12}}
@media (max-width:1100px){.span-3,.span-4,.span-5{grid-column:span 6}.span-7,.span-8{grid-column:span 12}}
/* ---------- Mobile app shell ---------- */
.topbar,.tabbar,.fab,.mobile-only{display:none}
.cards{flex-direction:column;gap:10px}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.rcard .rc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rcard .rc-top b{font-size:15px}
.rcard .rc-top .pill{margin-left:auto}
.rcard .rc-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.rcard .rc-row>span:first-child{color:var(--muted);flex:none}
.rcard .rc-row>span:last-child{text-align:right;min-width:0}
.rcard .rc-row .clip{max-width:200px}
.rcard .rc-meta{color:var(--muted);font-size:12px;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;font-weight:600;font-size:14px;line-height:1.3}
.tile .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--navy)}
.profile{background:var(--navy);color:#fff;border-radius:18px;padding:20px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.profile small{color:#c6d3e6;display:block}
.menu-list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.menu-list button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 16px;font-size:15px;text-align:left}
.menu-list button:last-child{border:0}
.menu-list button.danger{color:var(--red)}
.app-credit{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}

@media (max-width:900px){
  html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  body{background:#eef2f7}
  .side,.menu-btn,.desk-only{display:none!important}
  .mobile-only{display:block}
  .cards.mobile-only{display:flex}
  .main{margin-left:0;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}  /* stops iOS zooming into fields */
  .btn{min-height:44px}

  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .topbar img{width:30px;height:30px}
  .topbar .tb-title{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:rgba(255,255,255,.1);border:0;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}

  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.on{color:var(--navy);font-weight:600}
  .tabbar button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--brand)}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}

  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;width:56px;height:56px;border-radius:50%;
    border:0;background:var(--brand);color:var(--navy);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(11,44,79,.35)}
  .fab.hidden{display:none}

  .banner{background:none;border:0;padding:0 0 4px;margin-bottom:10px}
  #refreshDash,.page-head .btn{display:none}
  .banner select{background:#fff;box-shadow:var(--shadow)}
  .banner > div:not(.filters),.banner svg.pulse{display:none}
  .banner .filters{margin:0;width:100%;flex-wrap:nowrap}
  .banner select{flex:1;min-width:0}
  .page-head h2,.page-head .sub,.page-head > span:first-of-type,#addBtn{display:none}
  .page-head{margin:0}
  .toolbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:20;background:#eef2f7;padding:6px 0;margin:0 0 8px}
  .toolbar select,.toolbar input{min-width:0;flex:1}
  .toolbar #reloadBtn,.toolbar #qReload{display:none}
  .panel{border-radius:16px}
  .list-panel{background:none;box-shadow:none}
  .span-3,.span-4,.span-5,.span-6,.rec-panel{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{border-radius:16px}
  .kpi .val{font-size:21px}
  .donut-wrap{flex-direction:column;align-items:stretch}
  .donut-wrap .chart-box{margin:0 auto}

  .modal-bg{align-items:stretch}
  .modal{width:100%;height:100%;animation:up .22s ease-out;border-radius:0}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .modal header{padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:var(--navy);color:#fff;border:0}
  .modal header .x{color:#fff;font-size:26px}
  .modal header .pill{font-size:11px}
  .modal .body{padding:14px}
  .modal footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}
  .modal footer .btn{flex:1 1 40%}
  .modal footer .foot-spacer{display:none}
  .form-grid{grid-template-columns:1fr}
  #toast{left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom))}
  .toast{max-width:none;text-align:center}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.modal{animation:none}}
@media print{.side,.banner .filters,.menu-btn{display:none!important}.main{margin:0}}
.login-card{color:#fff}
.login-card .field label{color:#d5deeb;font-weight:500}
.login-card input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;caret-color:var(--brand);padding:12px 14px;border-radius:10px}
.login-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,165,95,.25)}
.login-card input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 40px #17395e inset;caret-color:var(--brand)}
.login-logo{display:flex;justify-content:center;margin:8px 0 22px}
.login-logo img{max-width:100%;height:auto}
.login-title{margin:0;text-align:center;font-size:27px;font-weight:700;color:#fff;letter-spacing:-.01em}
.login-sub{margin:10px auto 22px;text-align:center;color:#b9c7da;font-size:15.5px;max-width:330px;line-height:1.5}
.remember{display:flex;align-items:center;gap:10px;color:#d5deeb;font-size:14px;margin:2px 0 16px;cursor:pointer}
.remember input{width:16px;height:16px;margin:0;accent-color:var(--brand);padding:0}
.login-card .btn.brand{padding:13px;font-size:15px;border-radius:10px}
.login-msg{margin:10px 0 0;text-align:center;font-size:14px;color:#ffb4a8}
.login-msg:empty{display:none}
.login-msg.info{color:#ffd1a3}
.login-credit{margin:12px 0 0;text-align:center;color:#9fb2cf;font-size:13px}
.login-credit b{color:var(--brand)}
.btn.brand{background:var(--brand);color:#0b2c4f}
.signature{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.sig-label{font-size:11px;letter-spacing:.06em;color:#9fb2cf}
.sig-name{font-size:19px;font-weight:700;color:var(--brand);letter-spacing:.01em}
.sig-sub{font-size:12px;color:var(--muted);margin-top:2px}
.sig-inline{color:var(--brand-dark)}
.side-sig{margin-top:12px;padding-top:12px;align-items:flex-start}
.side-sig .sig-name{font-size:16px}
.acc-sig{margin-top:14px;background:var(--navy);border-radius:16px;padding:18px;border:0}
.side .logo{gap:10px}
.side .logo img{display:block;height:auto}
.side .logo small{display:block;margin-top:2px}

.nav button.on{box-shadow:inset 3px 0 0 var(--brand)}
</style>
</head>

function icon(name, size = 18) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ---------------- Helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
function fmt(n) { return n === '' || n === null || n === undefined || isNaN(n) ? '—' : nf.format(Number(n)); }
function money(n) { return fmt(n); }
function short(n) { n = Number(n) || 0; const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : nf.format(n); }
function dmy(s) { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : esc(s); }
function monthLabel(ym) { const [y, m] = ym.split('-'); return `${MONTHS_LONG[Number(m) - 1]} ${y}`; }
function prevMonth(ym) { let [y, m] = ym.split('-').map(Number); m -= 1; if (!m) { m = 12; y -= 1; } return `${y}-${String(m).padStart(2, '0')}`; }
function sum(rows, k) { return rows.reduce((a, r) => a + (Number(r[k]) || 0), 0); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function mod(key) { return S.modules.find(m => m.key === key); }
function txt(v, cls = 'clip') { return `<div class="${cls}" dir="auto" title="${esc(v)}">${esc(v)}</div>`; }

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), isErr ? 6000 : 3000);
}

async function api(action, data = {}) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('Set the Web App URL in the API_URL constant inside index.html');
  let res;
  try {
    // text/plain avoids the CORS preflight that Apps Script does not support
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...data }) });
  } catch (e) { throw new Error('Could not reach the server. Check your internet connection and the Web App URL'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Unexpected server response. Make sure the Web App is deployed with access set to "Anyone"'); }
  if (!j.ok) {
    if (j.code === 'AUTH') { endSession(); }
    throw new Error(j.error || 'Something went wrong');
  }
  return j.data;
}

/* ---------------- Session ---------------- */
async function start() {
  try { S.token = localStorage.getItem('ch_token'); } catch (e) { S.token = null; }
  S.token = S.token || sessionStorage.getItem('ch_token');
  if (!S.token) return showLogin();
  try { await loadBootstrap(); showApp(); } catch (e) { showLogin(e.message); }
}

function clearToken() { try { localStorage.removeItem('ch_token'); } catch (e) {} sessionStorage.removeItem('ch_token'); }
function showLogin(msg, info) {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const er = $('#loginErr');
  er.textContent = msg || ''; er.classList.toggle('info', !!info);
  setTimeout(() => $('#lu').focus(), 50);
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const remember = $('#remember').checked;
    const r = await api('login', { username: $('#lu').value, password: $('#lp').value, remember });
    S.token = r.token; clearToken();
    try { (remember ? localStorage : sessionStorage).setItem('ch_token', r.token); } catch (e) { sessionStorage.setItem('ch_token', r.token); }
    $('#lp').value = '';
    await loadBootstrap();
    showApp();
  } catch (err) { showLogin(err.message); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});

function endSession() {
  clearToken();
  S.token = null; S.user = null; S.dash = null; S.lists = {};
  closeModal();
  showLogin('Your session has expired. Please sign in again');
}

$('#logoutBtn').addEventListener('click', async () => {
  try { await api('logout'); } catch (e) { /* ignore */ }
  clearToken(); S.token = null; S.dash = null; S.lists = {}; showLogin('You have signed out.', true);
});

async function loadBootstrap() {
  const b = await api('bootstrap');
  Object.assign(S, { user: b.user, modules: b.modules, lookups: b.lookups, statuses: b.statuses, risks: b.risks, config: b.config, std: b.standards || {} });
  try { S.calc = new Function('return (' + b.calcSrc + ')')(); } catch (e) { S.calc = null; }
}

function showApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#meName').textContent = S.user.name;
  $('#meRole').textContent = S.user.roleLabel + (S.user.branch !== 'All' ? ' – ' + S.user.branch : '');

function menuButton() { return ''; }
function loadingHTML(t = 'Loading…') { return `<div class="loading"><span class="spin"></span>${t}</div>`; }

async function loadDash() {

  Object.keys(S.dash.data).forEach(k => S.dashData[k] = S.dash.data[k].map(r => fresh(k, r)));

}
async function renderDashboard(force) {

function bannerHTML(withFilters) {
  return `<div class="banner">
    ${menuButton()}
    <svg class="pulse" width="520" height="70" viewBox="0 0 520 70" aria-hidden="true"><path d="M0 40h312l10-14 16 36 18-48 14 26h150" fill="none" stroke="#fff" stroke-width="3"/></svg>
    <div><h2>Internal Audit Dashboard – Home Hospital</h2><p>Transparency · Control · Compliance · Sustainability</p></div>
    ${withFilters || ''}
  </div>`;
}

function fresh(key, r) {
  // re-run the shared calculations so date-based statuses (overdue, expiry…) are always current
  if (!S.calc || ['purchases', 'payroll', 'program'].includes(key)) return r;
  try { return S.calc(key, Object.assign({}, r), S.std); } catch (e) { return r; }
}

function allMonths() {
  const set = new Set();
  S.modules.forEach(m => { if (!m.dateKey) return; (S.dashData[m.key] || []).forEach(r => { const d = r[m.dateKey]; if (d && /^\d{4}-\d{2}/.test(d)) set.add(String(d).slice(0, 7)); }); });
  return [...set].sort().reverse();
}

function rows(key, opt = {}) {
  const m = mod(key); if (!m) return [];
  let list = S.dashData[key] || [];
  const branch = opt.branch !== undefined ? opt.branch : S.filters.branch;
  const month = opt.month !== undefined ? opt.month : S.filters.month;
  if (branch && m.branchKey) list = list.filter(r => r[m.branchKey] === branch);
  if (month && m.dateKey) list = list.filter(r => String(r[m.dateKey] || '').startsWith(month));
  return list;
}

const STD = (k, d) => { const v = Number((S.std || {})[k]); return isNaN(v) ? d : v; };
const pctOf = (a, b) => b ? a / b * 100 : null;
const avg = (list, k) => { const v = list.filter(r => r[k] !== '' && r[k] !== null && r[k] !== undefined && !isNaN(Number(r[k]))).map(r => Number(r[k])); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const isFlag = r => String(r.flag || r.check || '').startsWith('Needs review');

function kpiSet(month) {
  const o = { month };
  const fi = rows('findings', o), open = fi.filter(r => r.progress !== 'Closed');
  const prog = rows('program', { month: '' }), executed = prog.filter(r => ['Compliant', 'Non-compliant'].includes(r.result));
  const sv = rows('services', o), ex = rows('expenses', o), cs = rows('satisfaction', o), co = rows('complaints', o), cp = rows('compliance', o);
  const noDoc = ex.filter(r => r.hasDocument && r.hasDocument !== 'Complete');
  const coOpen = co.filter(r => r.progress !== 'Closed');
  return {
    findings: fi.length, closed: fi.length - open.length, open: open.length,
    overdue: open.filter(r => r.followUp === 'Overdue').length,
    critical: open.filter(r => r.risk === 'Critical').length, high: open.filter(r => r.risk === 'High').length,
    impact: sum(fi, 'impact'), potential: sum(fi, 'potential'),
    progTotal: prog.length, executed: executed.length, compliant: executed.filter(r => r.result === 'Compliant').length,
    collected: sum(sv, 'collected'), uncollected: sum(sv, 'outstanding'),
    rating: avg(cs, 'rating'), wait: avg(cs, 'wait'),
    complaintsOpen: coOpen.length, complaintsOverdue: coOpen.filter(r => r.followUp === 'Overdue').length,
    noDoc: sum(noDoc, 'amount'), noDocCount: noDoc.length,
    policy: avg(cp, 'pct'), policyCount: cp.length
  };
}

function deltaHTML(cur, prev, goodWhenUp) {
  if (!S.filters.month || prev === null || prev === undefined) return '';
  if (!prev) return cur ? `<span class="delta ${goodWhenUp ? 'good' : 'bad'}">New</span> vs last month` : '';
  const d = (cur - prev) / Math.abs(prev) * 100; const good = goodWhenUp ? d >= 0 : d <= 0;
  return `<span class="delta ${good ? 'good' : 'bad'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)}%</span> vs last month`;
}

function kpiCard(o) {
  return `<div class="kpi ${o.go !== undefined ? 'click' : ''}" ${o.go !== undefined ? `data-issues="${o.go}" title="Show these problems"` : ''} style="--c:${o.c};--cs:${o.cs}">
    <div class="top"><span class="ic">${icon(o.ic)}</span><span class="lbl">${o.label}</span></div>
    <div class="val num">${o.value}</div>
    <div class="foot">${o.foot || ''}</div></div>`;
}

/* ---------- automatic control analytics (early-warning tests) ---------- */
function analytics() {
  const tol = STD('tolerance', 1), out = [];
  const add = (test, source, n, value, limit, breached, unit = '') =>
    out.push({ test, source, n, value, limit, breached: n ? breached : false, unit });
  const cnt = (list, fn) => list.filter(fn).length;

  const sv = rows('services');
  add('Cancelled invoices', 'services', sv.length, pctOf(cnt(sv, r => r.cancelled === 'Yes'), sv.length), STD('maxCancelledInvoicesPct', 3), pctOf(cnt(sv, r => r.cancelled === 'Yes'), sv.length) > STD('maxCancelledInvoicesPct', 3), '%');
  const disc = cnt(sv, r => Number(r.discountPct) > STD('maxDiscountPct', 10) || (Number(r.discountPct) > 0 && !String(r.discountApprover || '').trim()));
  add('Discounts beyond authority', 'services', sv.length, disc, 0, disc > 0);
  const unbilled = cnt(sv, r => Number(r.diff) > tol);
  add('Services not fully invoiced', 'services', sv.length, unbilled, 0, unbilled > 0);
  const unc = cnt(sv, r => Number(r.outstanding) > tol);
  add('Invoices not collected', 'services', sv.length, unc, 0, unc > 0);

  const cash = rows('cash');
  const late = cnt(cash, r => Number(r.delayDays) > STD('maxDepositDelayDays', 1));
  add('Late cash deposits', 'cash', cash.length, late, 0, late > 0);
  const short_ = cnt(cash, r => Number(r.countDiff) < -tol);
  add('Cash count shortages', 'cash', cash.length, short_, 0, short_ > 0);

  const bk = rows('banks');
  const unrec = cnt(bk, r => Math.abs(Number(r.recDiff) || 0) > tol || Number(r.unrecordedTransfers) > 0 || Number(r.unrecordedCharges) > 0);
  add('Unreconciled bank accounts', 'banks', bk.length, unrec, 0, unrec > 0);

  const ir = rows('receivables');
  const rej = pctOf(sum(ir, 'rejected'), sum(ir, 'claims'));
  add('Insurance claim rejection rate', 'receivables', sum(ir, 'claims') ? 1 : 0, rej, STD('maxClaimRejectionPct', 10), rej > STD('maxClaimRejectionPct', 10), '%');
  const o90 = pctOf(sum(ir, 'age90'), sum(ir, 'total'));
  add('Debt older than 90 days', 'receivables', sum(ir, 'total') ? 1 : 0, o90, STD('maxOver90DebtPct', 10), o90 > STD('maxOver90DebtPct', 10), '%');

  const pu = rows('purchases');
  const noRec = cnt(pu, r => String(r.check).includes('without receipt'));
  add('Invoices without receipt report', 'purchases', pu.length, noRec, 0, noRec > 0);
  const seen = {}; let dup = 0;
  pu.forEach(r => { const k = String(r.supplier).trim().toLowerCase() + '|' + String(r.supplierInvoiceNo || '').trim().toLowerCase(); if (!r.supplierInvoiceNo) return; if (seen[k]) dup++; seen[k] = 1; });
  add('Duplicate supplier invoices', 'purchases', pu.length, dup, 0, dup > 0);
  const fewQ = cnt(pu, r => r.quotes !== '' && r.quotes !== undefined && Number(r.quotes) < STD('minQuotations', 3));
  add('Purchases with too few quotations', 'purchases', pu.length, fewQ, 0, fewQ > 0);

  const ex = rows('expenses');
  const nod = cnt(ex, r => r.hasDocument && r.hasDocument !== 'Complete');
  add('Payments without full documents', 'expenses', ex.length, nod, 0, nod > 0);
  const over = cnt(ex, r => Number(r.budget) > 0 && Number(r.variance) / Number(r.budget) * 100 > STD('maxExpenseVariancePct', 20));
  add('Expenses over budget', 'expenses', ex.length, over, 0, over > 0);

  const inv = rows('inventory');
  const stock = inv.reduce((a, r) => a + (Number(r.actualQty) || 0) * (Number(r.unitCost) || 0), 0);
  const bad = inv.filter(r => ['Expired', 'Near expiry'].includes(r.expiryStatus)).reduce((a, r) => a + (Number(r.actualQty) || 0) * (Number(r.unitCost) || 0), 0);
  add('Expired & near-expiry stock', 'inventory', stock ? 1 : 0, pctOf(bad, stock), STD('maxExpiredStockPct', 3), pctOf(bad, stock) > STD('maxExpiredStockPct', 3), '%');
  const cd = cnt(inv, r => Number(r.diffQty));
  add('Inventory count differences', 'inventory', inv.length, cd, 0, cd > 0);

  const pr = rows('payroll');
  const ot = cnt(pr, r => Number(r.otHours) > STD('overtimeCapHours', 20));
  add('Overtime above cap', 'payroll', pr.length, ot, 0, ot > 0);
  const ghost = cnt(pr, r => r.hrFile === 'No' || String(r.flag).includes('duplicate'));
  add('Employees without HR file / duplicated', 'payroll', pr.length, ghost, 0, ghost > 0);

  const du = rows('dues');
  const op = cnt(du, r => Number(r.diff) > tol || (r.proof && r.proof !== 'Complete'));
  add('Provider dues overpaid or unproven', 'dues', du.length, op, 0, op > 0);

  const tx = rows('tax');
  const txl = cnt(tx, isFlag);
  add('Late or short tax payments', 'tax', tx.length, txl, 0, txl > 0);

  const dv = rows('devices');
  const dvl = cnt(dv, isFlag);
  add('Devices: calibration, faults or shortages', 'devices', dv.length, dvl, 0, dvl > 0);

  const vh = rows('vehicles');
  const vhl = cnt(vh, isFlag);
  add('Vehicles: fuel or licence issues', 'vehicles', vh.length, vhl, 0, vhl > 0);

  const as = rows('assets');
  const asl = cnt(as, r => r.exists === 'No' || ['Idle', 'Under-utilized'].includes(r.utilization));
  add('Assets missing or idle', 'assets', as.length, asl, 0, asl > 0);

  const sc = rows('costing');
  const loss = cnt(sc, r => Number(r.profit) < 0);
  add('Loss-making services', 'costing', sc.length, loss, 0, loss > 0);

  const cs = rows('satisfaction');
  const w = cnt(cs, r => Number(r.wait) > STD('maxWaitMinutes', 30));
  add(`Patients waiting over ${STD('maxWaitMinutes', 30)} min`, 'satisfaction', cs.length, w, 0, w > 0);
  const ar = avg(cs, 'rating');
  add('Average satisfaction', 'satisfaction', cs.length, ar, STD('minSatisfaction', 4), ar !== null && ar < STD('minSatisfaction', 4), '/5');
  return out;
}

function cycleAnalysis() {
  const risk = rows('risk', { month: '' }), prog = rows('program', { month: '' }), fi = rows('findings');
  return (S.lookups.cycles || []).map(c => {
    const rk = risk.find(r => r.cycle === c);
    const f = fi.filter(r => r.domain === c), openF = f.filter(r => r.progress !== 'Closed');
    const p = prog.filter(r => r.cycle === c), ex = p.filter(r => ['Compliant', 'Non-compliant'].includes(r.result));
    const comp = ex.filter(r => r.result === 'Compliant').length;
    const overdue = openF.some(r => r.followUp === 'Overdue');
    const priority = (rk && rk.rating === 'Very High') || overdue || openF.some(r => r.risk === 'Critical') ? 'Immediate' : (rk && rk.rating === 'High') || openF.length ? 'High' : 'Routine';
    const status = openF.length ? 'Needs action' : p.length && ex.length < p.length ? 'In progress' : p.length ? 'Satisfactory' : 'Not planned';
    return { c, rk, f: f.length, open: openF.length, impact: sum(f, 'impact'), potential: sum(f, 'potential'), p: p.length, ex: ex.length, compPct: pctOf(comp, ex.length), priority, status };
  }).filter(x => x.rk || x.f || x.p);
}

function drawCycles() {
  const el = $('#cycles'), list = cycleAnalysis();
  if (!list.length) return emptyBox(el, 'Add the risk assessment and audit program to see the cycle analysis');
  const pr = { 'Immediate': 'p-red', 'High': 'p-amber', 'Routine': 'p-green' }, st = { 'Needs action': 'p-red', 'In progress': 'p-amber', 'Satisfactory': 'p-green', 'Not planned': 'p-gray' };
  el.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Cycle</th><th>Risk score</th><th>Rating</th><th>Sample</th><th>Findings (open)</th><th>Actual impact</th><th>Potential impact</th><th>Program done</th><th>Compliance</th><th>Priority</th><th>Control status</th></tr></thead><tbody>
    ${list.map(x => `<tr><td><b>${esc(x.c)}</b></td><td class="num">${x.rk ? fmt(x.rk.score) : '—'}</td><td>${ratingPill(x.rk && x.rk.rating)}</td><td class="num">${x.rk ? fmt(x.rk.sample) : '—'}</td>
      <td class="num">${x.f} (${x.open})</td><td class="num">${money(x.impact)}</td><td class="num">${money(x.potential)}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><div class="bar"><span style="width:${x.p ? x.ex / x.p * 100 : 0}%"></span></div><span class="num">${x.ex}/${x.p}</span></div></td>
      <td class="num">${x.compPct === null ? '—' : x.compPct.toFixed(0) + '%'}</td><td><span class="pill ${pr[x.priority]}">${x.priority}</span></td><td><span class="pill ${st[x.status]}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`;
}

function drawSeverity() {

  const cols = { 'Critical': '#dc3b34', 'High': '#e9951a', 'Medium': '#1d6fe0', 'Low': '#16a05d' };

      <td><div style="display:flex;align-items:center;gap:6px"><div class="bar"><span style="width:${sh}%;background:${cols[s]}"></span></div><span class="num">${sh.toFixed(0)}%</span></div></td></tr>`; }).join('')}</tbody></table>`;

function drawHeat() {
  const el = $('#heat'), risk = rows('risk', { month: '' });
  if (!risk.length) return emptyBox(el, 'No risk assessment yet');
  const color = s => s >= STD('riskVeryHigh', 15) ? '#f7c6c2' : s >= STD('riskHigh', 10) ? '#fde2b8' : s >= STD('riskMedium', 5) ? '#fff3c4' : '#d6f2e2';
  let cells = '';
  for (let im = 5; im >= 1; im--) {
    cells += `<div class="hm-axis">${im}</div>`;
    for (let li = 1; li <= 5; li++) {
      const here = risk.filter(r => Number(r.likelihood) === li && Number(r.impact) === im);
      cells += `<div class="hm-cell" style="background:${color(li * im)}" title="${esc(here.map(r => r.cycle).join(', ') || 'Likelihood ' + li + ' × Impact ' + im)}">${here.length ? `<b class="num">${here.length}</b>` : ''}</div>`;
    }
  }
  cells += `<div></div>${[1, 2, 3, 4, 5].map(i => `<div class="hm-axis">${i}</div>`).join('')}`;
  const top = risk.slice().sort((a, b) => Number(b.score) - Number(a.score)).slice(0, 4);
  el.innerHTML = `<div class="heat"><div class="hm-ylab">Impact</div><div class="hm-grid">${cells}</div></div><div class="hm-xlab">Likelihood</div>
    <ul class="legend" style="margin-top:8px">${top.map(r => `<li><span>${esc(r.cycle)}</span><span class="n num">${fmt(r.score)}</span>${ratingPill(r.rating)}</li>`).join('')}</ul>`;
}

function monthBuckets(keys) {
  const map = {};
  keys.forEach(key => { const m = mod(key); rows(key, { month: '' }).forEach(r => {
    const ym = String(r[m.dateKey] || '').slice(0, 7); if (!/^\d{4}-\d{2}$/.test(ym)) return;
    ((map[ym] = map[ym] || {})[key] = map[ym][key] || []).push(r);
  }); });
  let ks = Object.keys(map).sort();
  if (S.filters.month) ks = ks.filter(k => k <= S.filters.month);
  ks = ks.slice(-6);
  return { keys: ks, labels: ks.map(k => MONTHS[Number(k.slice(5)) - 1]), get: (ym, key) => (map[ym] && map[ym][key]) || [] };
}

/* =========================================================
   Issues & problems (read-only, available to every role)
   ========================================================= */
const LEVELS = ['High', 'Medium', 'Low'];
function levelOf(v) { return { 'Critical': 'High', 'Very High': 'High', 'High': 'High', 'Medium': 'Medium', 'Low': 'Low' }[v] || 'Medium'; }

function recordTitle(m, r) {
  const keys = ['description', 'procedure', 'task', 'item', 'control', 'service', 'supplier', 'name', 'bank', 'payer', 'asset', 'plate', 'cashier', 'type', 'empCode', 'invoiceNo', 'voucherNo', 'code', 'receiptNo', 'caseNo'];
  for (const k of keys) if (m.fields.some(f => f.key === k) && r[k]) return String(r[k]);
  return r.id;
}

function collectIssues() {
  const out = [];
  S.modules.forEach(m => (S.dashData[m.key] || []).forEach(r => {
    let reason = '', level = 'Medium', status = '';
    const ind = String(r.flag || r.check || '');
    if (m.key === 'findings') { if (r.progress === 'Closed') return; reason = r.followUp === 'Overdue' ? 'Open finding, overdue since ' + dmy(r.dueDate) : 'Open finding'; level = levelOf(r.risk); status = r.followUp; }
    else if (m.key === 'complaints') { if (r.progress === 'Closed') return; reason = r.followUp === 'Overdue' ? 'Not resolved by ' + dmy(r.expectedDate) : 'Not resolved yet'; level = levelOf(r.importance); status = r.followUp; }
    else if (m.key === 'program') { if (r.result !== 'Non-compliant') return; reason = 'Audit procedure result: non-compliant' + (r.findingRef ? ' (see ' + r.findingRef + ')' : ''); status = 'Non-compliant'; }
    else if (m.key === 'plan') { if (r.state !== 'Overdue') return; reason = `Recommendation overdue (${fmt(r.pct)}% done)`; status = 'Overdue'; }
    else if (m.key === 'compliance') { if (r.complianceStatus === 'Fully Applied' || r.progress === 'Completed') return; reason = `${r.complianceStatus} (${fmt(r.pct)}%)`; level = levelOf(r.risk); status = r.progress; }
    else if (m.key === 'framework') { if (!['Not implemented', 'Partially implemented'].includes(r.design)) return; reason = 'Control ' + String(r.design).toLowerCase(); status = r.design; }
    else if (m.key === 'risk') { return; }
    else if (ind.startsWith('Needs review')) { reason = ind.replace(/^Needs review:\s*/, ''); status = 'Needs review'; }
    else return;
    if (status === 'Overdue') level = 'High';
    out.push({ key: m.key, m, r, id: r.id, branch: m.branchKey ? r[m.branchKey] : '', date: m.dateKey ? r[m.dateKey] : '', title: recordTitle(m, r), reason, level, status });
  }));
  const rank = { High: 0, Medium: 1, Low: 2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level] || String(b.date).localeCompare(String(a.date)));
}

function openIssues(f = {}) {
  S.issueFilter = Object.assign({ module: '', branch: S.filters.branch || '', level: '', q: '' }, f);
  S.view = 'issues'; renderNav(); render(); window.scrollTo(0, 0);
}

  const main = $('#main');
  const head = `<div class="page-head"><span style="color:var(--red)">${icon('alert', 24)}</span><div><h2>Issues &amp; Problems</h2><div class="sub">Everything that needs attention in approved records, and which section it is in</div></div><span class="spacer"></span><button class="btn ghost" id="iReload">Refresh</button></div>`;
  if (!S.dash) {
    main.innerHTML = head + loadingHTML();
    try { await loadDash(); } catch (e) { main.innerHTML = head + `<div class="err">${esc(e.message)}</div>`; return; }
    if (S.view !== 'issues') return;
  }
  const F = S.issueFilter = S.issueFilter || { module: '', branch: S.filters.branch || '', level: '', q: '' };
  const all = collectIssues();
  S.issueCount = all.length;
  const byBranch = all.filter(i => !F.branch || !i.m.branchKey || i.branch === F.branch);
  const counts = {}; byBranch.forEach(i => counts[i.key] = (counts[i.key] || 0) + 1);
  const q = F.q.trim().toLowerCase();
  const list = byBranch.filter(i => (!F.module || i.key === F.module) && (!F.level || i.level === F.level) && (!q || (i.title + ' ' + i.reason + ' ' + i.id + ' ' + i.branch).toLowerCase().includes(q)));
  const lvl = l => `<span class="pill ${{ High: 'p-red', Medium: 'p-amber', Low: 'p-green' }[l]}">${l}</span>`;
  const sections = S.modules.filter(m => counts[m.key]);
  main.innerHTML = head + `
    <div class="chips">
      <button class="chip ${!F.module ? 'on' : ''}" data-mod="">All sections <b>${byBranch.length}</b></button>
      ${sections.map(m => `<button class="chip ${F.module === m.key ? 'on' : ''}" data-mod="${m.key}">${icon(m.icon, 15)} ${esc(m.title)} <b>${counts[m.key]}</b></button>`).join('')}
    </div>
    <div class="toolbar">
      <select id="iMod" aria-label="Section"><option value="">All sections</option>${S.modules.map(m => `<option value="${m.key}" ${F.module === m.key ? 'selected' : ''}>${esc(m.title)}${counts[m.key] ? ' (' + counts[m.key] + ')' : ''}</option>`).join('')}</select>
      <select id="iBranch" aria-label="Branch"><option value="">All branches</option>${(S.lookups.branches || []).map(b => `<option ${b === F.branch ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
      <select id="iLevel" aria-label="Priority"><option value="">All priorities</option>${LEVELS.map(l => `<option ${l === F.level ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input id="iQ" type="search" placeholder="Search problems…" value="${esc(F.q)}" aria-label="Search">
    </div>
    <div class="panel list-panel" style="padding:0">
    ${list.length ? `<div class="cards mobile-only">${list.map((i, n) => `<button class="rcard" data-i="${n}">
        <div class="rc-top"><span class="sec-tag">${icon(i.m.icon, 14)} ${esc(i.m.title)}</span>${lvl(i.level)}</div>
        <div class="iss-title" dir="auto">${esc(i.title)}</div><div class="iss-reason">${esc(i.reason)}</div>
        <div class="rc-meta"><b class="num">${esc(i.id)}</b>${i.branch ? ' · ' + esc(i.branch) : ''}${i.date ? ' · ' + dmy(i.date) : ''}</div></button>`).join('')}</div>
      <div class="tbl-wrap desk-only"><table><thead><tr><th>Priority</th><th>Section</th><th>ID</th><th>Problem</th><th>Branch</th><th>Date</th></tr></thead><tbody>
      ${list.map((i, n) => `<tr class="click" data-i="${n}" tabindex="0"><td>${lvl(i.level)}</td><td style="white-space:nowrap">${esc(i.m.title)}<div class="meta-line" style="margin:0">${esc(i.m.group || '')}</div></td><td class="num" style="white-space:nowrap"><b>${esc(i.id)}</b></td>
        <td><div class="iss-title clip" style="max-width:420px" dir="auto" title="${esc(i.title)}">${esc(i.title)}</div><div class="iss-reason">${esc(i.reason)}</div></td><td dir="auto">${esc(i.branch || '—')}</td><td class="num">${dmy(i.date)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty" style="padding:48px">${all.length ? 'No problems match these filters.' : 'No problems found in approved records. 🎉'}</div>`}
    </div>`;
  const re = () => renderIssues();
  main.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => { F.module = b.dataset.mod; re(); });
  $('#iMod').onchange = e => { F.module = e.target.value; re(); };
  $('#iBranch').onchange = e => { F.branch = e.target.value; re(); };
  $('#iLevel').onchange = e => { F.level = e.target.value; re(); };
  let t; $('#iQ').oninput = e => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; re(); setTimeout(() => { const i = $('#iQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  $('#iReload').onclick = async () => { S.dash = null; renderIssues(); };
  main.querySelectorAll('[data-i]').forEach(el => {
    const i = list[Number(el.dataset.i)];
    const open = () => showRecord(i.key, i.r, i.reason);
    el.onclick = open; el.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  if (S.user.role === 'viewer') renderNav();
}

/* read-only view of one approved record (works for every role, including viewers) */
function showRecord(key, r, reason) {
  const m = mod(key);
  const rows_ = m.fields.filter(f => r[f.key] !== '' && r[f.key] !== undefined && r[f.key] !== null)
    .map(f => `<div class="ro-row ${f.wide || f.type === 'textarea' ? 'wide' : ''}"><span>${esc(f.label)}</span><div>${f.type === 'textarea' || f.type === 'text' ? `<div dir="auto" style="white-space:pre-wrap">${esc(r[f.key])}</div>` : cellValue(f, r[f.key])}</div></div>`).join('');
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">${esc(r.id)} – ${esc(m.title)}</h3><span class="pill p-green">Approved</span><button class="x" data-act="close" aria-label="Close">×</button></header>
    <div class="body">
      <div class="meta-line">Section: <b>${esc(m.group || '')} › ${esc(m.title)}</b>${r.reviewedAt ? ` · approved <span class="num">${esc(r.reviewedAt)}</span>` : ''}</div>
      ${reason ? `<div class="callout red"><b>Why it is flagged:</b> ${esc(reason)}</div>` : ''}
      <div class="ro-grid">${rows_}</div>
    </div>
    <footer>${S.user.role === 'reviewer' ? `<button class="btn" id="roEdit">Open in ${esc(m.title)}</button>` : ''}<button class="btn ghost" data-act="close">Close</button></footer></div></div>`;
  document.addEventListener('keydown', escClose);
  $('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg' || e.target.closest('[data-act=close]')) closeModal(); });
  if ($('#roEdit')) $('#roEdit').onclick = async () => {
    closeModal(); S.view = 'm:' + key; renderNav(); await renderModule(key);
    const full = (S.lists[key] || []).find(x => x.id === r.id); if (full) openForm(key, full);
  };
  setTimeout(() => $('#modalRoot .x').focus(), 30);
}

/* =========================================================
   Section pages
   ========================================================= */
function statusPill(s) {
  const c = { [S.statuses.DRAFT]: 'p-gray', [S.statuses.SUBMITTED]: 'p-blue', [S.statuses.APPROVED]: 'p-green', [S.statuses.RETURNED]: 'p-red' }[s] || 'p-gray';
  return `<span class="pill ${c}">${esc(s)}</span>`;
}

function cellValue(f, v) {
  if (v === '' || v === undefined || v === null) return '—';
  const sv = String(v);
  if (f.key === 'flag' || f.key === 'check') {
    if (sv.startsWith('Needs review') || sv.startsWith('Exception')) return `<span class="pill p-red" title="${esc(sv)}">Needs review</span><div class="flag-why">${esc(sv.replace(/^(Needs review|Exception):\s*/, ''))}</div>`;
    return `<span class="pill p-green">OK</span>`;
  }
  if (f.type === 'number' || (f.type === 'computed' && typeof v === 'number')) return `<span class="num">${fmt(v)}${f.unit || ''}</span>`;
  if (f.type === 'date') return `<span class="num">${dmy(v)}</span>`;
  if (f.key === 'risk') return riskPill(v);
  if (f.key === 'rating') return ratingPill(v);
  if (f.key === 'importance') return riskPill(v);
  if (f.key === 'progress' || f.key === 'state' || f.key === 'followUp') return `<span class="pill ${stateClass(v)}">${esc(v)}</span>`;
  if (f.key === 'result') return `<span class="pill ${{ 'Compliant': 'p-green', 'Non-compliant': 'p-red', 'In Progress': 'p-amber' }[v] || 'p-gray'}">${esc(v)}</span>`;
  if (['expiryStatus', 'licenseStatus'].includes(f.key)) return `<span class="pill ${{ 'Expired': 'p-red', 'Near expiry': 'p-amber', 'Valid': 'p-green' }[v] || 'p-gray'}">${esc(v)}</span>`;
  if (f.key === 'design') return `<span class="pill ${{ 'Implemented': 'p-green', 'Partially implemented': 'p-amber', 'Not implemented': 'p-red' }[v] || 'p-blue'}">${esc(v)}</span>`;
  return txt(v);
}

async function renderModule(key, force) {
  const m = mod(key);
  const main = $('#main');
  const canAdd = S.user.role === 'entry' || S.user.role === 'reviewer';
  const head = `<div class="page-head">${menuButton()}<span style="color:var(--blue)">${icon(m.icon, 24)}</span><div><h2>${esc(m.title)}</h2>
    <div class="sub">${S.user.role === 'entry' ? 'Records you entered' : 'All records'}</div></div><span class="spacer"></span>
    ${canAdd ? `<button class="btn" id="addBtn">+ New record</button>` : ''}</div>`;
  if (!S.lists[key] || force) {
    main.innerHTML = head + loadingHTML();
    try { S.lists[key] = await api('list', { module: key }); } catch (e) { main.innerHTML = head + `<div class="err">${esc(e.message)}</div>`; return; }
  }
  if (S.view !== 'm:' + key) return;
  const listFields = m.fields.filter(f => f.list);
  const st = S.listFilter;
  const q = st.q.trim().toLowerCase();
  const data = S.lists[key].map(r => fresh(key, r)).filter(r => (!st.status || r.status === st.status) && (!q || JSON.stringify(r).toLowerCase().includes(q)));
  main.innerHTML = head + `
    <div class="toolbar">
      <select id="stF" aria-label="Approval status"><option value="">All statuses</option>${Object.values(S.statuses).map(s => `<option ${s === st.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <input id="qF" type="search" placeholder="Search records…" value="${esc(st.q)}" aria-label="Search">
      <button class="btn ghost" id="reloadBtn">Refresh</button>
    </div>
    <div class="panel list-panel" style="padding:0">
      ${data.length ? recordCards(data, (() => { const ind = listFields.filter(f => ['flag', 'check', 'followUp'].includes(f.key)); return listFields.filter(f => !ind.includes(f)).slice(0, 4 - ind.length).concat(ind); })(), r => `data-id="${esc(r.id)}"`) + `<div class="tbl-wrap desk-only"><table><thead><tr><th>ID</th>${listFields.map(f => `<th>${esc(f.label)}</th>`).join('')}<th>Approval</th><th>Updated</th></tr></thead><tbody>
      ${data.map(r => `<tr class="click" data-id="${esc(r.id)}" tabindex="0"><td class="num"><b>${esc(r.id)}</b></td>${listFields.map(f => `<td>${cellValue(f, r[f.key])}</td>`).join('')}<td>${statusPill(r.status)}</td><td class="num" style="white-space:nowrap">${esc(r.updatedAt)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty" style="padding:48px">${S.lists[key].length ? 'No records match your search.' : 'No records yet. Tap “+” or “New record” to add the first one.'}</div>`}
    </div>`;
  if ($('#addBtn')) $('#addBtn').onclick = () => openForm(key, null);
  $('#stF').onchange = e => { st.status = e.target.value; renderModule(key); };
  let t; $('#qF').oninput = e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; renderModule(key); setTimeout(() => { const i = $('#qF'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  $('#reloadBtn').onclick = () => renderModule(key, true);
  main.querySelectorAll('[data-id]').forEach(tr => {
    const open = () => openForm(key, S.lists[key].find(r => r.id === tr.dataset.id));
    tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
}

function recordCards(list, fields, idOf, extra) {

/* ---------------- Review queue ---------------- */
async function renderQueue() {
  const main = $('#main');
  const head = `<div class="page-head">${menuButton()}<span style="color:var(--blue)">${icon('inbox', 24)}</span><div><h2>Review Queue</h2><div class="sub">Submitted records waiting for approval, oldest first</div></div><span class="spacer"></span><button class="btn ghost" id="qReload">Refresh</button></div>`;
  main.innerHTML = head + loadingHTML();
  let items;
  try { items = await api('queue'); } catch (e) { main.innerHTML = head + `<div class="err">${esc(e.message)}</div>`; return; }
  if (S.view !== 'queue') return;
  S.queueCount = items.length; renderNav();
  main.innerHTML = head + `<div class="panel list-panel" style="padding:0">${items.length ? recordCards(items.map(it => it.record), [], (r, i) => `data-i="${i}"`, (r, i) => { const it = items[i]; const m = mod(it.module); const lf = m.fields.filter(f => f.list && f.type !== 'date').slice(0, 2);
      return `<b style="color:var(--ink)">${esc(m.title)}</b><div dir="auto" class="clip" style="max-width:100%">${esc(lf.map(f => it.record[f.key]).filter(v => v !== '' && v !== undefined).join(' · '))}</div>By ${esc(r.createdBy)} · <span class="num">${esc(r.updatedAt)}</span>`; }) + `<div class="tbl-wrap desk-only"><table><thead><tr><th>Section</th><th>ID</th><th>Summary</th><th>Submitted by</th><th>Submitted</th></tr></thead><tbody>
    ${items.map((it, i) => { const m = mod(it.module); const lf = m.fields.filter(f => f.list && f.type !== 'date').slice(0, 3);
      return `<tr class="click" data-i="${i}" tabindex="0"><td>${esc(m.title)}</td><td class="num"><b>${esc(it.record.id)}</b></td><td>${txt(lf.map(f => it.record[f.key]).filter(v => v !== '' && v !== undefined).join(' · '))}</td><td>${esc(it.record.createdBy)}</td><td class="num">${esc(it.record.updatedAt)}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty" style="padding:48px">Nothing waiting for review right now.</div>`}</div>`;
  $('#qReload').onclick = renderQueue;
  main.querySelectorAll('[data-i]').forEach(tr => {
    const it = items[Number(tr.dataset.i)];
    const open = () => openForm(it.module, it.record, () => renderQueue());
    tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
}

/* ---------------- Record form ---------------- */
function canEditRec(rec) {
  if (S.user.role === 'reviewer') return true;
  if (S.user.role !== 'entry') return false;
  if (!rec) return true;
  return rec.createdBy === S.user.username && [S.statuses.DRAFT, S.statuses.RETURNED].includes(rec.status);
}

function fieldInput(m, f, rec, editable) {
  const v = rec ? rec[f.key] : (f.def ?? '');
  const id = 'f_' + f.key;
  const dis = editable ? '' : 'disabled';
  const lockBranch = S.user.role === 'entry' && S.user.branch !== 'All' && m.branchKey === f.key;
  let input;
  if (f.type === 'computed') input = `<div class="computed ${/^Needs review|^Overdue|^Expired/.test(String(v)) ? 'bad' : ''}" id="${id}" aria-live="polite">${v === '' || v === undefined ? '—' : esc(typeof v === 'number' ? fmt(v) + (f.unit || '') : v)}</div>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}" dir="auto" ${dis}>${esc(v)}</textarea>`;
  else if (f.type === 'select' || f.type === 'yesno') {
    const opts = f.type === 'yesno' ? ['Yes', 'No'] : (f.opts || S.lookups[f.lookup] || []);
    const val = lockBranch ? S.user.branch : v;
    input = `<select id="${id}" ${dis} ${lockBranch ? 'disabled' : ''}><option value="">— Select —</option>${opts.map(o => {
      const blockClose = m.key === 'findings' && f.key === 'progress' && o === 'Closed' && S.user.role !== 'reviewer' && v !== 'Closed';
      return `<option ${o === val ? 'selected' : ''} ${blockClose ? 'disabled' : ''}>${esc(o)}</option>`; }).join('')}</select>`;
  } else {
    const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    const extra = f.type === 'number' ? `step="any" inputmode="decimal" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}` : 'dir="auto"';
    input = `<input id="${id}" type="${type}" value="${esc(v)}" ${extra} ${dis}>`;
  }
  return `<div class="field ${f.wide ? 'wide' : ''}"><label for="${id}">${esc(f.label)} ${f.req ? '<span class="req" aria-hidden="true">*</span>' : ''}</label>${input}${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</div>`;
}

function collect(m) {
  const o = {};
  m.fields.forEach(f => {
    if (f.type === 'computed') return;
    const el = document.getElementById('f_' + f.key); if (!el) return;
    o[f.key] = el.value;
  });
  if (S.user.role === 'entry' && S.user.branch !== 'All' && m.branchKey) o[m.branchKey] = S.user.branch;
  return o;
}

function closeModal() { $('#modalRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeModal(); }

function openForm(key, rec, onDone) {
  const m = mod(key);
  if (rec) rec = fresh(key, rec);
  const editable = canEditRec(rec);
  const role = S.user.role;
  const isNew = !rec;
  const canUpload = rec && (role === 'reviewer' || (role === 'entry' && rec.createdBy === S.user.username));
  const att = rec ? (() => { try { return JSON.parse(rec.attachments || '[]'); } catch (e) { return []; } })() : [];

  let notice = '';
  if (rec && rec.status === S.statuses.RETURNED && rec.reviewNote) notice = `<div class="callout red"><b>Returned for changes:</b> <span dir="auto">${esc(rec.reviewNote)}</span></div>`;
  else if (rec && !editable && role === 'entry') notice = `<div class="callout blue">This record is ${esc(rec.status)} and can’t be edited now.${rec.status === S.statuses.APPROVED ? ' You can still upload attachments as evidence of action.' : ''}</div>`;

  const meta = rec ? `<div class="meta-line">Created by <b>${esc(rec.createdBy)}</b> on <span class="num">${esc(rec.createdAt)}</span>${rec.reviewedBy ? ` · reviewed by <b>${esc(rec.reviewedBy)}</b> on <span class="num">${esc(rec.reviewedAt)}</span>` : ''}</div>` : '';

  const attHTML = `<div class="att"><h4>Attachments & supporting documents</h4>
    ${isNew ? '<div style="color:var(--muted);font-size:13px">Save the record first, then upload photos of documents or PDFs.</div>' : `
    ${att.length ? `<ul>${att.map(a => `<li>${icon('doc', 16)}<span dir="auto" title="${esc(a.name)}">${esc(a.name)}</span><span class="num" style="flex:none;color:var(--muted);font-size:12px">${Math.ceil((a.size || 0) / 1024)} KB</span>
      <button class="linkbtn" data-open="${esc(a.id)}">View</button>${editable ? `<button class="linkbtn danger" data-del="${esc(a.id)}">Delete</button>` : ''}</li>`).join('')}</ul>` : '<div style="color:var(--muted);font-size:13px;margin-bottom:8px">No attachments yet.</div>'}
    ${canUpload ? `<label class="btn ghost sm" style="cursor:pointer">Upload attachment<input type="file" id="fileIn" accept="image/*,application/pdf" class="hidden"></label>
      <span style="color:var(--muted);font-size:12px;margin-inline-start:8px">Images or PDF, up to ${S.config.maxFileMB} MB</span>` : ''}`}</div>`;

  let buttons = '';
  if (role === 'entry' && editable) {
    buttons = `<button class="btn" data-act="submit">Submit for review</button><button class="btn ghost" data-act="draft">Save as draft</button>`;
    if (!isNew) buttons += `<span class="foot-spacer"></span><button class="btn ghost" data-act="delete" style="color:var(--red)">Delete record</button>`;
  } else if (role === 'reviewer') {
    if (isNew) buttons = `<button class="btn green" data-act="save">Save & approve</button>`;
    else {
      if (rec.status === S.statuses.SUBMITTED) buttons = `<button class="btn green" data-act="approve">Approve</button><button class="btn amber" data-act="return">Return for changes</button>`;
      buttons += `<button class="btn ghost" data-act="save">Save changes</button>`;
      if (rec.status === S.statuses.APPROVED) buttons += `<button class="btn ghost" data-act="return">Return for changes</button>`;
      buttons += `<span class="foot-spacer"></span><button class="btn ghost" data-act="delete" style="color:var(--red)">Delete record</button>`;
    }
  }
  buttons += `<button class="btn ghost" data-act="close">Close</button>`;

  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">${isNew ? 'New record – ' + esc(m.title) : esc(rec.id) + ' – ' + esc(m.title)}</h3>${rec ? statusPill(rec.status) : ''}<button class="x" data-act="close" aria-label="Close">×</button></header>
    <div class="body">${notice}${meta}<div class="form-grid">${m.fields.map(f => fieldInput(m, f, rec, editable)).join('')}</div>${attHTML}
      <div id="returnBox" class="hidden" style="margin-top:14px"><div class="field"><label for="retNote">Reason for returning (shown to the data entry user)</label><textarea id="retNote" dir="auto"></textarea></div>
      <button class="btn amber" data-act="confirmReturn">Confirm return</button></div>
    </div>
    <footer>${buttons}</footer></div></div>`;
  document.addEventListener('keydown', escClose);
  $('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg') closeModal(); });
  setTimeout(() => { const first = $('#modalRoot .body input:not([disabled]),#modalRoot .body select:not([disabled]),#modalRoot .body textarea:not([disabled])'); (first || $('#modalRoot .x')).focus(); }, 30);

  // live computed fields
  const computed = m.fields.filter(f => f.type === 'computed');
  if (computed.length && editable) {
    $('#modalRoot .body').addEventListener('input', () => {
      const r = collect(m);
      if (S.calc) S.calc(key, r, S.std);
      computed.forEach(f => { const v = r[f.key]; const el = $('#f_' + f.key); if (v === undefined) return; el.textContent = v === '' ? '—' : (typeof v === 'number' ? fmt(v) + (f.unit || '') : v); el.classList.toggle('bad', String(v).startsWith('Needs review') || v === 'Overdue' || v === 'Expired'); });
    });
  }

  const after = async (saved, msg) => {
    toast(msg);
    if (S.lists[key]) {
      const i = S.lists[key].findIndex(r => r.id === (saved ? saved.id : rec.id));
      if (saved) { if (i >= 0) S.lists[key][i] = saved; else S.lists[key].unshift(saved); }
      else if (i >= 0) S.lists[key].splice(i, 1);
    }
    S.dash = null;
    if (role === 'reviewer') refreshQueueCount();
    if (onDone) onDone(saved); else render();
  };

  const busy = (on) => $('#modalRoot footer').querySelectorAll('button').forEach(b => b.disabled = on);

  $('#modalRoot .modal').addEventListener('click', async e => {
    const openId = e.target.closest('[data-open]')?.dataset.open;
    const delId = e.target.closest('[data-del]')?.dataset.del;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (openId) return openAttachment(key, rec.id, openId);
    if (delId) {
      if (!confirm('Delete this attachment permanently?')) return;
      try { const saved = await api('removeFile', { module: key, id: rec.id, fileId: delId }); await after(saved, 'Attachment deleted'); openForm(key, saved, onDone); } catch (err) { toast(err.message, true); }
      return;
    }
    if (!act) return;
    if (act === 'close') return closeModal();
    if (act === 'return') { $('#returnBox').classList.remove('hidden'); $('#retNote').focus(); return; }
    busy(true);
    try {
      if (act === 'draft' || act === 'submit' || act === 'save') {
        const record = collect(m); if (rec) record.id = rec.id;
        const saved = await api('save', { module: key, record, submit: act === 'submit' });
        closeModal();
        await after(saved, act === 'submit' ? 'Submitted for review' : act === 'draft' ? 'Saved as draft' : 'Saved');
        if (isNew && act !== 'submit') openForm(key, saved, onDone); // keep it open so attachments can be added
      } else if (act === 'approve') {
        const record = collect(m); record.id = rec.id;
        await api('save', { module: key, record });
        const saved = await api('review', { module: key, id: rec.id, decision: 'approve' });
        closeModal(); await after(saved, 'Approved');
      } else if (act === 'confirmReturn') {
        const saved = await api('review', { module: key, id: rec.id, decision: 'return', note: $('#retNote').value });
        closeModal(); await after(saved, 'Returned for changes');
      } else if (act === 'delete') {
        if (!confirm('Delete this record permanently? The deletion is kept in the audit log.')) { busy(false); return; }
        await api('remove', { module: key, id: rec.id });
        closeModal(); await after(null, 'Record deleted');
      }
    } catch (err) { toast(err.message, true); busy(false); }
  });

  const fi = $('#fileIn');
  if (fi) fi.onchange = async () => {
    const file = fi.files[0]; if (!file) return;
    if (file.size > S.config.maxFileMB * 1024 * 1024) return toast(`File is larger than ${S.config.maxFileMB} MB`, true);
    if (!S.config.allowedMime.includes(file.type)) return toast('File type not allowed. Upload an image or a PDF', true);
    toast('Uploading…');
    try {
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Could not read the file')); r.readAsDataURL(file); });
      const saved = await api('upload', { module: key, id: rec.id, name: file.name, mime: file.type, data });
      await after(saved, 'Attachment uploaded');
      openForm(key, saved, onDone);
    } catch (err) { toast(err.message, true); }
  };
}

async function openAttachment(module, id, fileId) {
  const w = window.open('', '_blank'); // open before awaiting so the browser doesn't block it
  if (w) w.document.write('<p style="font-family:sans-serif;padding:20px">Loading attachment…</p>');
  try {
    const f = await api('getFile', { module, id, fileId });
    const bytes = Uint8Array.from(atob(f.data), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
    if (w) w.location = url; else window.open(url, '_blank');
  } catch (err) { if (w) w.close(); toast(err.message, true); }
}

start();
</script>
</body>
</html>
